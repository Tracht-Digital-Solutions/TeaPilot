name: Android and Wear OS APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: https://github.com/android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: https://github.com/gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Test and build both apps
        run: gradle --no-daemon :core:test :androidApp:lintDebug :wearApp:lintDebug :androidApp:assembleDebug :wearApp:assembleDebug
      - uses: https://github.com/actions/upload-artifact@v3
        with:
          name: teapilot-debug-apks
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            wearApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
